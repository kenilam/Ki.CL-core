steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    args: ['build', '--no-cache', '-t', '$_IMAGE', '.']

  - id: Check
    name: $_IMAGE
    entrypoint: yarn
    args: ['tsx', 'Server/Scripts/registry.ts', 'check', '$_REGISTRY_BUCKET']

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ['push', '$_IMAGE']

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services update $_SERVICE_NAME \
          --image=$_IMAGE \
          --region=$_DEPLOY_REGION \
          --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID \
          --quiet
        gcloud run services describe $_SERVICE_NAME --region=$_DEPLOY_REGION --format='value(status.url)' > /workspace/url

  - id: Publish
    name: $_IMAGE
    entrypoint: bash
    args: ['-c', 'yarn tsx Server/Scripts/registry.ts publish $_REGISTRY_BUCKET "$(cat /workspace/url)/api"']

substitutions:
  _AR_HOSTNAME: us-central1-docker.pkg.dev
  _AR_REPOSITORY: cloud-run-source-deploy
  _DEPLOY_REGION: us-central1
  _SERVICE_NAME: ki-cl-core-dev
  _REGISTRY_BUCKET: ki-cl-registry-dev
  _IMAGE: ${_AR_HOSTNAME}/${PROJECT_ID}/${_AR_REPOSITORY}/ki.cl-core/${_SERVICE_NAME}:${COMMIT_SHA}

options:
  dynamicSubstitutions: true
  logging: CLOUD_LOGGING_ONLY

images:
  - $_IMAGE
